# Server Configuration
server.port=${SERVER_PORT:8081}

# Database Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qlsv?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Minh@nh195}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# Tự động tạo/cập nhật cấu trúc bảng trong MySQL nếu chưa tồn tại
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Giữ nguyên chính xác tên bảng và tên cột viết hoa/thường như trong Entity và qlsv_schema.sql
spring.jpa.hibernate.naming.physical-strategy=${JPA_NAMING_STRATEGY:org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl}

# Cấu hình Jackson JSON Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Ho_Chi_Minh
