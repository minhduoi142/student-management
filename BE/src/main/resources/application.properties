# Server Configuration
server.port=${SERVER_PORT:8081}

# Cấu hình UTF-8 cho Servlet & HTTP Response
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Database Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qlsv?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

# Tự động tạo/cập nhật cấu trúc bảng trong MySQL nếu chưa tồn tại
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Giữ nguyên chính xác tên bảng và tên cột viết hoa/thường như trong Entity và qlsv_schema.sql
spring.jpa.hibernate.naming.physical-strategy=${JPA_NAMING_STRATEGY:org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl}

# Cấu hình Jackson JSON Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Cấu hình JWT Security
jwt.secret=${JWT_SECRET:9a4f2c8d3e71b5a6c4d8e2f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cấu hình Google OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Cấu hình Frontend OAuth2 Redirect URI
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
app.oauth2.failure-redirect-uri=${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/login}
