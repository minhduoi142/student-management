services:
  mysql:
    image: mysql:8.0
    container_name: qlsv-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --init-connect=SET NAMES utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qlsv
      LANG: C.UTF-8
    ports:
      # Map ra port 3307 trên host để tránh xung đột nếu máy bạn đã chạy MySQL local (port 3306)
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./qlsv_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qlsv-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlsv-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/qlsv?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JPA_SHOW_SQL: "true"
      JPA_FORMAT_SQL: "true"
      JPA_DDL_AUTO: update
      JPA_NAMING_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      JWT_SECRET: 9a4f2c8d3e71b5a6c4d8e2f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1
      JWT_EXPIRATION_MS: 86400000
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    networks:
      - qlsv-network

volumes:
  mysql_data:
    name: qlsv_mysql_data

networks:
  qlsv-network:
    name: qlsv-network
    driver: bridge
