services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlsv-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://qlsv-backend:8081}
    networks:
      - qlsv-network

networks:
  qlsv-network:
    external: true
